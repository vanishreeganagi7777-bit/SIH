<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee registration</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/polish.css"></head>
<body><main class="shell"><a class="brand" href="/">ECORA / EMPLOYEE ACCESS</a><section class="card"><p class="eyebrow">First-time enrolment</p><h1>Register your face</h1><p class="intro">Enter your official details, consent to biometric capture, then take 3–8 samples with only your face in view.</p>
<form id="registerForm"><label>Official employee ID<input id="officialId" required maxlength="50" autocomplete="off"></label><label>Full name<input id="fullName" required maxlength="120" autocomplete="name"></label><label>Designation<input id="designation" required maxlength="120"></label><label class="consent"><input id="consent" type="checkbox" required> I consent to capture and process my face solely for sign-in.</label><div class="camera"><video id="camera" autoplay playsinline muted></video><div id="cameraHint">Camera off</div></div><div class="actions"><button type="button" class="secondary" id="startCamera">Start camera</button><button type="button" id="capture" disabled>Capture sample <span id="sampleCount">(0/3)</span></button></div><div class="samples" id="samples" aria-label="Captured samples"></div><button id="submit" disabled>Complete registration</button><p class="status" id="status" role="status"></p></form><p class="switch">Already enrolled? <a href="/login">Sign in with face</a></p></section></main><script src="/static/camera.js"></script><script>setupRegistration();</script></body></html>
